<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
        <meta name="description" content="Bruno Caregnato — Desenvolvedor de Software Sênior" />
        <script>
          (function () {
            function fixViewport() {
              var viewport = document.querySelector('meta[name="viewport"]');
              if (viewport) {
                viewport.setAttribute(
                  "content",
                  "width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
                );
              }
            }
            fixViewport();
            window.addEventListener("resize", fixViewport);
            window.addEventListener("orientationchange", fixViewport);
            document.addEventListener("DOMContentLoaded", fixViewport);
          })();
        </script>
        <title>Bruno Caregnato</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <link href="css/styles.css" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v5.13.0/js/all.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="bg-blobs" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="lang-toggle" role="group" aria-label="Idioma / Language">
            <button type="button" data-lang="pt">PT</button>
            <button type="button" data-lang="en">EN</button>
        </div>

        <main class="profile">
            <img class="avatar" src="assets/images/my_photo.jpg" alt="Bruno Caregnato" />
            <h1 class="name">Bruno Caregnato</h1>
            <p class="role" data-i18n="role">Desenvolvedor de Software Sênior na Fourge, atuando externamente para a Unimed Porto Alegre</p>
            <p class="meta">
                <span data-i18n="education">Bacharel em Ciência da Computação</span> — <a class="link" href="https://www.ucs.br/site" target="_blank" rel="noopener">UCS</a> &middot; <span data-i18n="location">Caxias do Sul, Brasil</span>
            </p>

            <a class="resume-button" href="assets/resume/bruno-caregnato-resume.pdf" target="_blank" rel="noopener">
                <i class="fas fa-file-pdf"></i>
                <span data-i18n="resume">Currículo (PDF)</span>
            </a>

            <nav class="socials" data-i18n-aria aria-label="Redes sociais">
                <a title="GitHub" target="_blank" rel="noopener" href="https://github.com/brunocaregnato"><i class="fab fa-github"></i></a>
                <a title="LinkedIn" target="_blank" rel="noopener" href="https://www.linkedin.com/in/bmcaregnato/"><i class="fab fa-linkedin-in"></i></a>
                <a title="Instagram" target="_blank" rel="noopener" href="https://www.instagram.com/brunocareg/"><i class="fab fa-instagram"></i></a>
            </nav>
        </main>

        <script src="js/main.js"></script>
    </body>
</html>
